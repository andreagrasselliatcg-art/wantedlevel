<h2>Installazione completata</h2>
<p>Riapri la tua DAW e cerca <b>Wanted Level</b> tra gli effetti di <b>Tune Talks</b>.</p>
<p>Se Logic non vede subito il plug-in, apri il Terminale ed esegui:<br>
<code>killall -9 AudioComponentRegistrar</code><br>poi riapri Logic.</p>
